services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - edmms-data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/edmms.db
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  edmms-data:
